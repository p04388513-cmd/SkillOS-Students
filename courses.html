<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse SkillOS courses — programming, design, data science, marketing, and more.">
  <title>Courses — SkillOS</title>
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/courses.css">
</head>
<body>

<div id="page-loader"><div class="loader-ring"></div></div>
<div id="toast-container"></div>

<div class="app-layout">
  <!-- SIDEBAR NAVIGATION -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo" style="display:flex; align-items:center; gap:10px;">
      <img src="images/logo.png" alt="SkillOS Logo" style="height:36px; border-radius: var(--r-sm);">
      <span class="logo-text">Skill<em>OS</em></span>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">Main Workspace</div>
      <a href="dashboard.html" class="nav-item">
        <span class="nav-icon">🏠</span> Dashboard
      </a>
      <a href="courses.html" class="nav-item active">
        <span class="nav-icon">📚</span> Courses
        <span class="nav-badge">6</span>
      </a>
      <a href="ai-coach.html" class="nav-item">
        <span class="nav-icon">🤖</span> AI Coach
      </a>
      <a href="assessments.html" class="nav-item">
        <span class="nav-icon">📝</span> Assessments
      </a>
      <a href="progress.html" class="nav-item">
        <span class="nav-icon">📈</span> Progress
      </a>
      <a href="certificates.html" class="nav-item">
        <span class="nav-icon">🏆</span> Certificates
      </a>

      <div class="nav-section-label" style="margin-top:16px;">Account Settings</div>
      <a href="profile.html" class="nav-item">
        <span class="nav-icon">👤</span> Profile
      </a>
      <a href="settings.html" class="nav-item">
        <span class="nav-icon">⚙️</span> Settings
      </a>
    </nav>

    <div class="sidebar-user">
      <div class="sidebar-user-info" onclick="window.location.href='profile.html'">
        <div class="user-avatar" id="sidebar-avatar">
          <span data-user-avatar>S</span>
        </div>
        <div style="min-width:0; flex:1;">
          <div class="user-name truncate" data-user-name>Student</div>
          <div class="user-role">Premium Member</div>
        </div>
      </div>
      <button class="sidebar-logout-btn" data-logout-btn title="Sign Out" aria-label="Sign Out">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </div>
  </aside>

  <div id="sidebar-overlay" class="hidden" style="position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:150; backdrop-filter:blur(2px);"></div>

  <!-- MAIN WINDOW -->
  <main class="main-content">
    <header class="page-header">
      <div class="page-header-inner">
        <div>
          <h1 class="page-title">Course Catalog</h1>
          <p class="page-subtitle">Learn verified skills at your own pace.</p>
        </div>
        <div class="flex items-center gap-3">
          <button class="hamburger" id="hamburger-btn">
            <span></span><span></span><span></span>
          </button>
        </div>
      </div>
    </header>

    <div class="page-body">
      <!-- Category chips -->
      <div class="filter-chips" style="margin-bottom: 20px;">
        <button class="chip active filter-chip" data-category="">🌟 All Subjects</button>
        <button class="chip filter-chip" data-category="Programming">💻 Programming</button>
        <button class="chip filter-chip" data-category="Design">🎨 Design</button>
        <button class="chip filter-chip" data-category="Data Science">📊 Data Science</button>
        <button class="chip filter-chip" data-category="Finance">💰 Finance</button>
        <button class="chip filter-chip" data-category="Marketing">📈 Marketing</button>
      </div>

      <!-- Filters Row -->
      <div class="filter-bar">
        <div class="search-bar filter-search">
          <span class="search-icon">🔍</span>
          <input type="text" id="course-search" placeholder="Search by title, instructor, description...">
        </div>
        <div class="filter-sep"></div>
        <select class="filter-select" id="filter-category">
          <option value="">All Categories</option>
          <option value="Programming">Programming</option>
          <option value="Design">Design</option>
          <option value="Data Science">Data Science</option>
          <option value="Finance">Finance</option>
          <option value="Marketing">Marketing</option>
        </select>
        <select class="filter-select" id="filter-level">
          <option value="">All Levels</option>
          <option value="Beginner">Beginner</option>
          <option value="Intermediate">Intermediate</option>
          <option value="Advanced">Advanced</option>
        </select>
        <select class="filter-select" id="filter-enrolled">
          <option value="">All Courses</option>
          <option value="enrolled">My Enrolled</option>
          <option value="available">Available</option>
        </select>
      </div>

      <!-- Results details -->
      <p class="results-info" id="results-count">Showing <strong>0</strong> courses</p>

      <!-- Courses Grid -->
      <div class="courses-grid" id="courses-grid">
        <div class="skeleton" style="height: 320px; border-radius: var(--r-xl);"></div>
        <div class="skeleton" style="height: 320px; border-radius: var(--r-xl);"></div>
        <div class="skeleton" style="height: 320px; border-radius: var(--r-xl);"></div>
      </div>
    </div>
  </main>
</div>

<!-- Mobile Bottom Navigation -->
<nav class="mobile-bottom-nav">
  <div class="mobile-nav-items">
    <a href="dashboard.html" class="mobile-nav-item">
      <span class="mni">🏠</span>Dashboard
    </a>
    <a href="courses.html" class="mobile-nav-item active">
      <span class="mni">📚</span>Courses
    </a>
    <a href="ai-coach.html" class="mobile-nav-item">
      <span class="mni">🤖</span>Coach
    </a>
    <a href="progress.html" class="mobile-nav-item">
      <span class="mni">📈</span>Progress
    </a>
    <a href="profile.html" class="mobile-nav-item">
      <span class="mni">👤</span>Profile
    </a>
  </div>
</nav>

<script type="module" src="js/courses.js?v=2"></script>
</body>
</html>
