<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assessments — SkillOS</title>
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/courses.css">
  <link rel="stylesheet" href="css/assessments.css">
</head>
<body>

<div id="page-loader"><div class="loader-ring"></div></div>
<div id="toast-container"></div>

<div class="app-layout">
  <!-- SIDEBAR NAVIGATION -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark">S</div>
      <span class="logo-text">Skill<em>OS</em></span>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">Main Workspace</div>
      <a href="dashboard.html" class="nav-item">
        <span class="nav-icon">🏠</span> Dashboard
      </a>
      <a href="courses.html" class="nav-item">
        <span class="nav-icon">📚</span> Courses
      </a>
      <a href="ai-coach.html" class="nav-item">
        <span class="nav-icon">🤖</span> AI Coach
      </a>
      <a href="assessments.html" class="nav-item active">
        <span class="nav-icon">📝</span> Assessments
      </a>
      <a href="progress.html" class="nav-item">
        <span class="nav-icon">📈</span> Progress
      </a>
      <a href="certificates.html" class="nav-item">
        <span class="nav-icon">🏆</span> Certificates
      </a>

      <div class="nav-section-label" style="margin-top:16px;">Account Settings</div>
      <a href="profile.html" class="nav-item">
        <span class="nav-icon">👤</span> Profile
      </a>
      <a href="settings.html" class="nav-item">
        <span class="nav-icon">⚙️</span> Settings
      </a>
    </nav>

    <div class="sidebar-user">
      <div class="sidebar-user-info" onclick="window.location.href='profile.html'">
        <div class="user-avatar" id="sidebar-avatar">
          <span data-user-avatar>S</span>
        </div>
        <div style="min-width:0; flex:1;">
          <div class="user-name truncate" data-user-name>Student</div>
          <div class="user-role">Premium Member</div>
        </div>
      </div>
      <button class="sidebar-logout-btn" data-logout-btn title="Sign Out" aria-label="Sign Out">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </div>
  </aside>

  <div id="sidebar-overlay" class="hidden" style="position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:150; backdrop-filter:blur(2px);"></div>

  <!-- MAIN WINDOW -->
  <main class="main-content">
    <header class="page-header">
      <div class="page-header-inner">
        <div>
          <h1 class="page-title">Skill Assessments</h1>
          <p class="page-subtitle">Verify your mastery and earn extra XP points.</p>
        </div>
        <div class="flex items-center gap-3">
          <button class="hamburger" id="hamburger-btn">
            <span></span><span></span><span></span>
          </button>
        </div>
      </div>
    </header>

    <div class="page-body">
      <!-- Assessment cards list view -->
      <div class="assess-grid" id="assess-grid-view">
        <p class="text-sm text-muted">Loading assessments…</p>
      </div>

      <!-- Active Interactive Exam Container -->
      <div id="exam-player-view" class="hidden"></div>
    </div>
  </main>
</div>

<!-- Bottom Navigation bar -->
<nav class="mobile-bottom-nav">
  <div class="mobile-nav-items">
    <a href="dashboard.html" class="mobile-nav-item">
      <span class="mni">🏠</span>Dashboard
    </a>
    <a href="courses.html" class="mobile-nav-item">
      <span class="mni">📚</span>Courses
    </a>
    <a href="ai-coach.html" class="mobile-nav-item">
      <span class="mni">🤖</span>Coach
    </a>
    <a href="progress.html" class="mobile-nav-item">
      <span class="mni">📈</span>Progress
    </a>
    <a href="profile.html" class="mobile-nav-item">
      <span class="mni">👤</span>Profile
    </a>
  </div>
</nav>

<script type="module" src="js/assessments.js?v=3"></script>
</body>
</html>
